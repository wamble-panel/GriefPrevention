    Text: $x$f$f$9$a$a$2✘ ᴏɴʟʏ ᴛʜᴇ ᴄʟᴀɪᴍ ᴏᴡɴᴇʀ ᴄᴀɴ ᴅᴇᴍᴏᴛᴇ ᴀ ᴍᴀɴᴀɢᴇʀ.
    Default: Only the claim owner can demote a manager.
  PlayerNotIgnorable:
    Text: $x$f$f$9$a$a$2✘ ʏᴏᴜ ᴄᴀɴ'ᴛ ɪɢɴᴏʀᴇ ᴛʜᴀᴛ ᴘʟᴀʏᴇʀ.
    Default: You can't ignore that player.
  NoEnoughBlocksForChestClaim:
    Text: $x$f$f$b$5$a$7✦ $x$f$f$d$8$b$eʙᴇᴄᴀᴜꜱᴇ ʏᴏᴜ ᴅᴏɴ'ᴛ ʜᴀᴠᴇ ᴀɴʏ ᴄʟᴀɪᴍ ʙʟᴏᴄᴋꜱ ᴀᴠᴀɪʟᴀʙʟᴇ, ɴᴏ ᴀᴜᴛᴏᴍᴀᴛɪᴄ ʟᴀɴᴅ ᴄʟᴀɪᴍ ᴡᴀꜱ ᴄʀᴇᴀᴛᴇᴅ ꜰᴏʀ ʏᴏᴜ.  ʏᴏᴜ ᴄᴀɴ ᴜꜱᴇ $x$f$f$c$8$d$d/claimslist$x$f$f$d$8$b$e ᴛᴏ ᴍᴏɴɪᴛᴏʀ ʏᴏᴜʀ ᴀᴠᴀɪʟᴀʙʟᴇ ᴄʟᴀɪᴍ ʙʟᴏᴄᴋ ᴛᴏᴛᴀʟ.
    Default: Because you don't have any claim blocks available, no automatic land claim was created for you.  You can use /claimslist to monitor your available claim block total.
  MustHoldModificationToolForThat:
    Text: $x$f$f$9$a$a$2✘ ʏᴏᴜ ᴍᴜꜱᴛ ʙᴇ ʜᴏʟᴅɪɴɢ ᴀ ɢᴏʟᴅᴇɴ ꜱʜᴏᴠᴇʟ ᴛᴏ ᴅᴏ ᴛʜᴀᴛ.
    Default: You must be holding a golden shovel to do that.
  StandInClaimToResize:
    Text: $x$f$f$9$a$a$2✘ ꜱᴛᴀɴᴅ ɪɴꜱɪᴅᴇ ᴛʜᴇ ʟᴀɴᴅ ᴄʟᴀɪᴍ ʏᴏᴜ ᴡᴀɴᴛ ᴛᴏ ʀᴇꜱɪᴢᴇ.
    Default: Stand inside the land claim you want to resize.
  ClaimsExtendToSky:
    Text: $x$c$d$b$4$d$b✦ $x$f$f$d$8$b$eʟᴀɴᴅ ᴄʟᴀɪᴍꜱ ᴀʟᴡᴀʏꜱ ᴇxᴛᴇɴᴅ ᴛᴏ ᴍᴀx ʙᴜɪʟᴅ ʜᴇɪɢʜᴛ.
    Default: Land claims always extend to max build height.
  ClaimsAutoExtendDownward:
    Text: $x$c$d$b$4$d$b✦ $x$f$f$d$8$b$eʟᴀɴᴅ ᴄʟᴀɪᴍꜱ ᴀᴜᴛᴏ-ᴇxᴛᴇɴᴅ ᴅᴇᴇᴘᴇʀ ɪɴᴛᴏ ᴛʜᴇ ɢʀᴏᴜɴᴅ ᴡʜᴇɴ ʏᴏᴜ ᴘʟᴀᴄᴇ ʙʟᴏᴄᴋꜱ ᴜɴᴅᴇʀ ᴛʜᴇᴍ.
    Default: Land claims auto-extend deeper into the ground when you place blocks under them.
  MinimumRadius:
    Text: $x$f$f$9$a$a$2✘ ᴍɪɴɪᴍᴜᴍ ʀᴀᴅɪᴜꜱ ɪꜱ $x$f$f$e$5$e$c{0}$x$f$f$9$a$a$2.
    Default: Minimum radius is {0}.
  ClaimTooSmallForActiveBlocks:
    Text: $x$f$f$9$a$a$2✘ ᴛʜɪꜱ ᴄʟᴀɪᴍ ɪꜱɴ'ᴛ ʙɪɢ ᴇɴᴏᴜɢʜ ᴛᴏ ꜱᴜᴘᴘᴏʀᴛ ᴀɴʏ ᴀᴄᴛɪᴠᴇ ʙʟᴏᴄᴋ ᴛʏᴘᴇꜱ (ʜᴏᴘᴘᴇʀꜱ, ꜱᴘᴀᴡɴᴇʀꜱ, ʙᴇᴀᴄᴏɴꜱ...).  ᴍᴀᴋᴇ ᴛʜᴇ ᴄʟᴀɪᴍ ʙɪɢɢᴇʀ ꜰɪʀꜱᴛ.
    Default: This claim isn't big enough to support any active block types (hoppers, spawners, beacons...).  Make the claim bigger first.
  TooManyActiveBlocksInClaim:
    Text: $x$f$f$9$a$a$2✘ ᴛʜɪꜱ ᴄʟᴀɪᴍ ɪꜱ ᴀᴛ ɪᴛꜱ ʟɪᴍɪᴛ ꜰᴏʀ ᴀᴄᴛɪᴠᴇ ʙʟᴏᴄᴋ ᴛʏᴘᴇꜱ (ʜᴏᴘᴘᴇʀꜱ, ꜱᴘᴀᴡɴᴇʀꜱ, ʙᴇᴀᴄᴏɴꜱ...).  ᴇɪᴛʜᴇʀ ᴍᴀᴋᴇ ɪᴛ ʙɪɢɢᴇʀ, ᴏʀ ʀᴇᴍᴏᴠᴇ ᴏᴛʜᴇʀ ᴀᴄᴛɪᴠᴇ ʙʟᴏᴄᴋꜱ ꜰɪʀꜱᴛ.
    Default: This claim is at its limit for active block types (hoppers, spawners, beacons...).  Either make it bigger, or remove other active blocks first.

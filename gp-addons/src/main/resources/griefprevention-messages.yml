    Default: No player by that name has logged in recently.
  TransferTopLevel:
    Text: $x$c$d$b$4$d$b✎ $x$f$f$d$8$b$eᴏɴʟʏ ᴛᴏᴘ ʟᴇᴠᴇʟ ᴄʟᴀɪᴍꜱ (ɴᴏᴛ ꜱᴜʙᴅɪᴠɪꜱɪᴏɴꜱ) ᴍᴀʏ ʙᴇ ᴛʀᴀɴꜱꜰᴇʀʀᴇᴅ.  ꜱᴛᴀɴᴅ ᴏᴜᴛꜱɪᴅᴇ ᴏꜰ ᴛʜᴇ ꜱᴜʙᴅɪᴠɪꜱɪᴏɴ ᴀɴᴅ ᴛʀʏ ᴀɢᴀɪɴ.
    Default: Only top level claims (not subdivisions) may be transferred.  Stand outside of the subdivision and try again.
  TransferSuccess:
    Text: $x$b$5$e$a$d$7✔ $x$f$f$d$8$b$eᴄʟᴀɪᴍ ᴛʀᴀɴꜱꜰᴇʀʀᴇᴅ.
    Default: Claim transferred.
  TrustListNoClaim:

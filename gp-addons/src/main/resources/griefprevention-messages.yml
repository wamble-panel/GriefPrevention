# GriefPrevention's messages in the GPAddons palette, generated by tools/gen_gp_messages.py.
# GPAddons copies each Text into plugins/GriefPreventionData/messages.yml unless you changed that message.
# Default is GriefPrevention's own text, used to tell whether a message was changed.
Messages:
  RespectingClaims:
    Text: $x$b$5$e$a$d$7✔ $x$f$f$d$8$b$eɴᴏᴡ ʀᴇꜱᴘᴇᴄᴛɪɴɢ ᴄʟᴀɪᴍꜱ.
    Default: Now respecting claims.
  IgnoringClaims:
    Text: $x$b$5$e$a$d$7✔ $x$f$f$d$8$b$eɴᴏᴡ ɪɢɴᴏʀɪɴɢ ᴄʟᴀɪᴍꜱ.
    Default: Now ignoring claims.
  NoCreativeUnClaim:
    Text: $x$f$f$9$a$a$2✘ ʏᴏᴜ ᴄᴀɴ'ᴛ ᴜɴᴄʟᴀɪᴍ ᴛʜɪꜱ ʟᴀɴᴅ.  ʏᴏᴜ ᴄᴀɴ ᴏɴʟʏ ᴍᴀᴋᴇ ᴛʜɪꜱ ᴄʟᴀɪᴍ ʟᴀʀɢᴇʀ ᴏʀ ᴄʀᴇᴀᴛᴇ ᴀᴅᴅɪᴛɪᴏɴᴀʟ ᴄʟᴀɪᴍꜱ.
    Default: You can't unclaim this land.  You can only make this claim larger or create additional claims.
  SuccessfulAbandon:
    Text: $x$b$5$e$a$d$7✔ $x$f$f$d$8$b$eᴄʟᴀɪᴍꜱ ᴀʙᴀɴᴅᴏɴᴇᴅ.  ʏᴏᴜ ɴᴏᴡ ʜᴀᴠᴇ $x$f$f$e$5$e$c{0}$x$f$f$d$8$b$e ᴀᴠᴀɪʟᴀʙʟᴇ ᴄʟᴀɪᴍ ʙʟᴏᴄᴋꜱ.
    Default: Claims abandoned.  You now have {0} available claim blocks.
  RestoreNatureActivate:
    Text: $x$c$d$b$4$d$b✎ $x$f$f$d$8$b$eʀᴇᴀᴅʏ ᴛᴏ ʀᴇꜱᴛᴏʀᴇ ꜱᴏᴍᴇ ɴᴀᴛᴜʀᴇ!  ʀɪɢʜᴛ ᴄʟɪᴄᴋ ᴛᴏ ʀᴇꜱᴛᴏʀᴇ ɴᴀᴛᴜʀᴇ, ᴀɴᴅ ᴜꜱᴇ $x$f$f$c$8$d$d/basicclaims$x$f$f$d$8$b$e ᴛᴏ ꜱᴛᴏᴘ.
    Default: Ready to restore some nature!  Right click to restore nature, and use /basicclaims to stop.
  RestoreNatureAggressiveActivate:
    Text: $x$f$f$b$5$a$7✦ $x$f$f$d$8$b$eᴀɢɢʀᴇꜱꜱɪᴠᴇ ᴍᴏᴅᴇ ᴀᴄᴛɪᴠᴀᴛᴇᴅ.  ᴅᴏ $lɴᴏᴛ$x$f$f$d$8$b$e ᴜꜱᴇ ᴛʜɪꜱ ᴜɴᴅᴇʀɴᴇᴀᴛʜ ᴀɴʏᴛʜɪɴɢ ʏᴏᴜ ᴡᴀɴᴛ ᴛᴏ ᴋᴇᴇᴘ!  ʀɪɢʜᴛ ᴄʟɪᴄᴋ ᴛᴏ ᴀɢɢʀᴇꜱꜱɪᴠᴇʟʏ ʀᴇꜱᴛᴏʀᴇ ɴᴀᴛᴜʀᴇ, ᴀɴᴅ ᴜꜱᴇ $x$f$f$c$8$d$d/basicclaims$x$f$f$d$8$b$e ᴛᴏ ꜱᴛᴏᴘ.
    Default: Aggressive mode activated.  Do NOT use this underneath anything you want to keep!  Right click to aggressively restore nature, and use /basicclaims to stop.
  FillModeActive:
    Text: $x$b$5$e$a$d$7✔ $x$f$f$d$8$b$eꜰɪʟʟ ᴍᴏᴅᴇ ᴀᴄᴛɪᴠᴀᴛᴇᴅ ᴡɪᴛʜ ʀᴀᴅɪᴜꜱ $x$f$f$e$5$e$c{0}$x$f$f$d$8$b$e.  ʀɪɢʜᴛ ᴄʟɪᴄᴋ ᴀɴ ᴀʀᴇᴀ ᴛᴏ ꜰɪʟʟ.
    Default: Fill mode activated with radius {0}.  Right click an area to fill.
  TransferClaimPermission:
    Text: $x$f$f$9$a$a$2✘ ᴛʜᴀᴛ ᴄᴏᴍᴍᴀɴᴅ ʀᴇǫᴜɪʀᴇꜱ ᴛʜᴇ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴠᴇ ᴄʟᴀɪᴍꜱ ᴘᴇʀᴍɪꜱꜱɪᴏɴ.
    Default: That command requires the administrative claims permission.
  TransferClaimMissing:
    Text: $x$c$d$b$4$d$b✎ $x$f$f$d$8$b$eᴛʜᴇʀᴇ'ꜱ ɴᴏ ᴄʟᴀɪᴍ ʜᴇʀᴇ.  ꜱᴛᴀɴᴅ ɪɴ ᴛʜᴇ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴠᴇ ᴄʟᴀɪᴍ ʏᴏᴜ ᴡᴀɴᴛ ᴛᴏ ᴛʀᴀɴꜱꜰᴇʀ.
    Default: There's no claim here.  Stand in the administrative claim you want to transfer.
  TransferClaimAdminOnly:
    Text: $x$f$f$9$a$a$2✘ ᴏɴʟʏ ᴀᴅᴍɪɴɪꜱᴛʀᴀᴛɪᴠᴇ ᴄʟᴀɪᴍꜱ ᴍᴀʏ ʙᴇ ᴛʀᴀɴꜱꜰᴇʀʀᴇᴅ ᴛᴏ ᴀ ᴘʟᴀʏᴇʀ.
    Default: Only administrative claims may be transferred to a player.

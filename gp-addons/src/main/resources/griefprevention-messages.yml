  NetherPortalTrapDetectionMessage:
    Text: $x$c$d$b$4$d$b✦ $x$f$f$d$8$b$eɪᴛ ꜱᴇᴇᴍꜱ ʏᴏᴜ ᴍɪɢʜᴛ ʙᴇ ꜱᴛᴜᴄᴋ ɪɴꜱɪᴅᴇ ᴀ ɴᴇᴛʜᴇʀ ᴘᴏʀᴛᴀʟ. ᴡᴇ ᴡɪʟʟ ʀᴇꜱᴄᴜᴇ ʏᴏᴜ ɪɴ ᴀ ꜰᴇᴡ ꜱᴇᴄᴏɴᴅꜱ ɪꜰ ᴛʜᴀᴛ ɪꜱ ᴛʜᴇ ᴄᴀꜱᴇ!
    Default: It seems you might be stuck inside a nether portal. We will rescue you in a few seconds if that is the case!

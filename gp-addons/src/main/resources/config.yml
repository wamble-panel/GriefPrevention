config-version: 2

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃  GPAddons: claim menus, flags, bans and an      ┃
# ┃  entry whitelist for GriefPrevention            ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# All text players see is in messages.yml.

# The claim outline shown when inspecting or making claims.
# If anything goes wrong drawing it, GriefPrevention shows its normal outline instead.
outline:
  enabled: true
  # glow:   glowing blocks you can see through walls, like HuskClaims' highlighter
  # blocks: GriefPrevention's glowstone and gold blocks, raised off the ground
  style: glow
  # How many blocks above the ground to draw each style (0 = on the ground itself)
  height-offset:
    glow: 0
    blocks: 1
  # The blocks each kind of outline is made of, for both styles: corners and the blocks along the sides.
  # Any block works, with states in brackets if you like, e.g. redstone_ore[lit=true]
  blocks:
    claim:
      corner: glowstone
      side: gold_block
    admin-claim:
      corner: glowstone
      side: pumpkin
    subdivision:
      corner: iron_block
      side: white_wool
    # Shown while making a claim, after the first corner
    new-claim:
      corner: diamond_block
      side: diamond_block
    # Where a new claim would overlap another one
    conflict:
      corner: redstone_ore[lit=true]
      side: netherrack
  # Glow colours for each kind of outline (hex)
  glow-colors:
    claim: '#FFC8DD'
    admin-claim: '#FFB5A7'
    subdivision: '#CDB4DB'
    conflict: '#FF9AA2'
    other: '#A2D2FF'

worldguard:
  # Stop players claiming land that overlaps a WorldGuard region (spawn, safe zones...), and resizing into one.
  # Players with gpaddons.claim-in-regions are allowed. Only works when WorldGuard is installed.
  block-claims-in-regions: true
  # Regions where claiming is still allowed
  allowed-regions: []

teams:
  # Turn the whole team system on or off (/team, team access in claims)
  enabled: true
  # Team names are letters, numbers and underscores. Players with gpaddons.team.color may colour them with
  # hex codes, e.g. /team create &#FFB5A7Pink or <gradient:#FFB5A7:#FFC8DD>Pink</gradient>
  name-length:
    min: 3
    max: 16
  # Most players in one team, leader included (0 = no limit)
  max-members: 0
  max-ranks: 10
  # How long an invite lasts
  invite-expiry-seconds: 300
  # /team home (the Swift Return upgrade shortens both)
  home:
    warmup-seconds: 3
    cooldown-seconds: 30
  # Quest goals and the team points each quest gives
  quests:
    gathering_the_crew: {goal: 3, points: 1}
    a_place_to_call_home: {goal: 1, points: 1}
    shared_ground: {goal: 1, points: 1}
    into_the_unknown: {goal: 3, points: 1}
    the_final_frontier: {goal: 3, points: 1}
    family_reunion: {goal: 4, points: 1}
    strength_in_numbers: {goal: 100, points: 1}
    harvest_festival: {goal: 500, points: 1}
    master_builders: {goal: 2000, points: 1}
    deep_delvers: {goal: 250, points: 1}
  # Team points each upgrade level costs
  upgrades:
    bountiful_harvest: {costs: [1, 2, 3]}
    animal_husbandry: {costs: [1, 2, 3]}
    team_vault: {costs: [1, 2, 3]}
    bigger_team: {costs: [1, 2, 3]}
    land_grant: {costs: [1, 2, 3]}
    wisdom: {costs: [1, 2, 3]}
    swift_return: {costs: [1, 2, 3]}
    # Lets a team's claims have hostile mobs spawning (the Monster Spawning flag). Set required: false to let
    # every claim owner turn it on without the upgrade
    monster_lure: {costs: [2], required: true}

teleport:
  # Owners and managers can teleport to their claims from /claims (right-click a claim, or the Teleport button)
  enabled: true
  # Seconds to stand still before teleporting (moving or getting hurt cancels it)
  warmup-seconds: 3
  # Seconds between teleports
  cooldown-seconds: 30

claim-notices:
  # "✿ Entering Steve's Claim" when walking into someone's claim (texts are in messages.yml under notices)
  enabled: true
  # Where to show it: actionbar (above the hotbar), title (middle of the screen) or chat
  display: actionbar
  # Also say when leaving a claim
  show-leaving: false

menus:
  # Ask for player names and claim names with Minecraft's input screen (1.21.7+) instead of typing in chat
  use-input-screens: false
  # Open the menus for GriefPrevention's /claimslist, /trustlist, /abandonclaim, and /trust with no name
  replace-griefprevention-commands: true

griefprevention-messages:
  # Restyle GriefPrevention's own messages (plugins/GriefPreventionData/messages.yml) in the same colours.
  # The original file is kept as messages.yml.before-gpaddons. Messages you've changed yourself are left alone;
  # run /gpaddons gp-messages force to restyle those too, or /gpaddons gp-messages restore to undo.
  restyle: true

protection:
  # Doors, trapdoors and fence gates in claims need access trust (or the claim's Use Blocks flag),
  # even though GriefPrevention leaves wooden doors and trapdoors unlocked by default
  lock-doors: true
  # Stop sponges outside a claim soaking up water inside it
  sponges: true

bans:
  # Copy bans and "ban all" claims from plugins/BanFromClaim/data.dat the first time GPAddons starts.
  # Run /gpaddons import-banfromclaim to copy them again.
  import-banfromclaim: true

transfer:
  # The new owner must have enough unused claim blocks for the claim
  require-claim-blocks: true

names:
  max-length: 32

# What a claim allows when its owner hasn't changed a flag.
# Player flags (true = anyone may do it, false = only trusted players):
#   these match GriefPrevention's normal protection, so nothing changes until an owner flips a flag.
# Environment flags (true = it happens, false = it's stopped):
#   fire, explosions and mob griefing follow your GriefPrevention config until an owner sets them.
flags:
  defaults:
    block_place: false
    block_break: false
    block_interact: false
    redstone_interact: false
    container_open: false
    farm_block_break: false
    farm_block_place: false
    farm_block_interact: false
    fill_bucket: false
    empty_bucket: false
    place_hanging_entity: false
    break_hanging_entity: false
    place_vehicle: false
    break_vehicle: false
    entity_interact: false
    use_spawn_egg: false
    ender_pearl_teleport: false
    start_raid: false
    player_damage_player: false
    player_damage_monster: true
    player_damage_entity: false
    player_damage_persistent_entity: false
    # Off by default: a claim's owner turns it on after their team buys the Monster Lure upgrade
    monster_spawn: false
    passive_mob_spawn: true
    monster_damage_terrain: false
    explosion_damage_terrain: false
    explosion_damage_entity: true
    fire_burn: false
    fire_spread: false
    redstone_actuate: true
